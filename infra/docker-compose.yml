services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: db:3306
    volumes:
      - wp_data:/var/www/html
      - ../wordpress-theme/eno-workbench:/var/www/html/wp-content/themes/eno-workbench
      - ../content-importer:/var/www/html/wp-content/plugins/eno-workbench-content-importer
    depends_on:
      - db
  wpcli:
    image: wordpress:cli-php8.2
    restart: "no"
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: db:3306
    volumes:
      - wp_data:/var/www/html
      - ../wordpress-theme/eno-workbench:/var/www/html/wp-content/themes/eno-workbench
      - ../content-importer:/var/www/html/wp-content/plugins/eno-workbench-content-importer
      - ./bootstrap-wordpress.sh:/usr/local/bin/bootstrap-wordpress.sh:ro
    entrypoint: ["sh", "/usr/local/bin/bootstrap-wordpress.sh"]
    depends_on:
      - wordpress
volumes:
  db_data:
  wp_data:
